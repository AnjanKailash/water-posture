name: Build APK

on:
  push:
  workflow_dispatch:   # lets you click "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is already installed on GitHub's Ubuntu runners
      # (ANDROID_HOME is set), so no separate Android setup step is needed.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: WaterPosture-apk
          path: app/build/outputs/apk/debug/app-debug.apk
